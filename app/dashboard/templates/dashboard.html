{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Home Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{% static 'dashboard/css/style.css' %}">
  <script src="{% static 'dashboard/js/theme.js' %}"></script>
</head>

<body>

<!-- Ambient Background -->
<div class="ambient-bg">
  <div class="ambient-orb"></div>
  <div class="ambient-orb"></div>
  <div class="ambient-orb"></div>
</div>

<!-- Mobile Sidebar Overlay -->
<div id="sidebar-overlay" class="sidebar-overlay" onclick="closeMobileSidebar()"></div>

<div class="app-layout">

  <!-- ======= SIDEBAR ======= -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <div class="sidebar-brand-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <div class="sidebar-brand-text">
          <h1>Smart Home</h1>
          <span>Control Panel</span>
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <div class="sidebar-section">
      <div class="sidebar-section-label">Navigation</div>
      <div class="sidebar-item active" onclick="setGroup('room'); closeMobileSidebar();">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
        <span>All Devices</span>
      </div>
    </div>

    <!-- Rooms -->
    <div class="sidebar-section">
      <div class="sidebar-section-label">Rooms</div>
      <div id="sidebar-rooms">
        <!-- Populated dynamically -->
      </div>
    </div>

    <!-- Footer -->
    <div class="sidebar-footer">
      <form id="logout-form" method="post" action="{% url 'logout' %}">
        {% csrf_token %}
      </form>
      <div class="sidebar-item" onclick="confirmLogout()" style="cursor:pointer;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
        <span>Logout</span>
      </div>
    </div>
  </aside>

  <!-- ======= MAIN CONTENT ======= -->
  <main class="main-content">

    <!-- Header -->
    <header class="top-header">
      <div class="header-top-row">
        <div class="header-left-group">
          <button class="header-btn mobile-menu-btn" onclick="toggleMobileSidebar()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
          </button>
          <div class="header-left">
            <div id="header-greeting" class="header-greeting">Good Evening, My dear {{ request.user.username }}.</div>
            <div class="header-subtitle">Here's your home overview</div>
          </div>
        </div>

        <div class="header-right">
          <span id="live-clock" class="live-clock">--:--:--</span>
          <div id="ws-badge" class="connection-badge disconnected">
            <span class="status-dot off"></span> Connecting...
          </div>
          <button class="header-btn" onclick="toggleTheme()" id="theme-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-icon orange">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
        </div>
        <div id="stat-total" class="stat-value">0</div>
        <div class="stat-label">Total Devices</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon green">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </div>
        <div id="stat-active" class="stat-value">0</div>
        <div class="stat-label">Active Now</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon blue">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <div id="stat-rooms" class="stat-value">0</div>
        <div class="stat-label">Rooms</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon purple">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13a10 10 0 0 1 14 0"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" x2="12.01" y1="20" y2="20"/></svg>
        </div>
        <div id="stat-connection" class="stat-value">--</div>
        <div class="stat-label">Connection</div>
      </div>
    </div>

    <!-- Content Area -->
    <div class="content-area">

      <!-- Group Header -->
      <div class="group-header">
        <div class="group-tabs">
          <button class="group-tab active" data-mode="room" onclick="setGroup('room')">By Room</button>
          <button class="group-tab" data-mode="type" onclick="setGroup('type')">By Type</button>
        </div>
      </div>

      <!-- Device Groups Container -->
      <div id="groups" class="space-y-8">
        <!-- Loading skeleton -->
        <div class="devices-grid">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
      </div>

    </div>

  </main>
</div>

<script src="{% static 'dashboard/js/dashboard.js' %}"></script>

</body>
</html>
