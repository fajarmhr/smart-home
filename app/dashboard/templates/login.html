{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Home — Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{% static 'dashboard/css/style.css' %}">
  <script src="{% static 'dashboard/js/theme.js' %}"></script>
</head>

<body>

<!-- Ambient Background -->
<div class="ambient-bg">
  <div class="ambient-orb"></div>
  <div class="ambient-orb"></div>
  <div class="ambient-orb"></div>
</div>

<!-- Theme Toggle -->
<div class="theme-toggle-float">
  <button class="header-btn" onclick="toggleTheme()" id="theme-icon">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
  </button>
</div>

<!-- Login Card -->
<div class="login-wrapper">
  <div class="login-card">

    <div class="login-brand">
      <div class="login-brand-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </div>
      <h1>Smart Home</h1>
    </div>

    <p class="login-subtitle">Sign in to your control panel</p>

    <form method="post">
      {% csrf_token %}

      <div class="form-group">
        <label class="form-label">Username</label>
        <input
          type="text"
          name="username"
          required
          placeholder="Enter your username"
          class="form-input">
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input
          type="password"
          name="password"
          required
          placeholder="Enter your password"
          class="form-input">
      </div>

      <button type="submit" class="login-btn">
        Sign In
      </button>
    </form>

  </div>
</div>

</body>
</html>
